<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <div class="logo">
                <i class="fa-brands fa-spotify"></i> <span>Spotify-ish</span>
            </div>
            <nav>
                <ul>
                    <li class="active"><i class="fa-solid fa-house"></i> Home</li>
                    <li><i class="fa-solid fa-magnifying-glass"></i> Search</li>
                    <li><i class="fa-solid fa-book"></i> Your Library</li>
                </ul>
            </nav>
        </div>

        <div class="content">
            <header>
                <h2>Welcome back!</h2>
            </header>
            
            <div class="playlist-section">
                <h3>Popular Songs</h3>
                <div class="song-list" id="songList">
                    </div>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div class="now-playing">
            <div class="track-info">
                <p id="currentTitle">Select a song</p>
                <p id="currentArtist" class="artist">Artist</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                <button id="playBtn" class="play-main"><i class="fa-solid fa-circle-play"></i></button>
                <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" value="0" min="0" max="100">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="volume-control">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volumeBar" min="0" max="1" step="0.1" value="1">
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script src="script.js"></script>
</body>
</html>
