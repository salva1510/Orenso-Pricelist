<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FilesFlex</title>

  <link rel="stylesheet" href="/files.css">
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <header class="header">

      <div>
        <div class="logo">
          Files<span>Flex</span>
        </div>

        <div class="subtitle">
          Your personal file manager
        </div>
      </div>

      <a href="/" class="home-button">
        🏠 Home
      </a>

    </header>


    <!-- UPLOAD -->
    <section class="upload-box">

      <h2>📤 Upload File</h2>

      <input
        type="file"
        id="fileInput"
      >

      <button
        id="uploadButton"
        class="primary-button"
      >
        ⬆ Upload
      </button>

      <div id="uploadStatus"></div>

    </section>


    <!-- FILE STATUS -->
    <section class="file-header">

      <div>
        <h2>📁 My Files</h2>

        <div id="status">
          Loading files...
        </div>
      </div>

      <button
        id="refreshButton"
        class="refresh-button"
      >
        🔄 Refresh
      </button>

    </section>


    <!-- FILE LIST -->
    <main id="files">

    </main>

  </div>


  <script src="/files.js"></script>

</body>
</html>
